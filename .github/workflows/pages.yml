name: Campus Preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campus-preview-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          repository: yaskelly/yaskelly.github.io
          ref: experiment/campus-subscription-mailbox
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure isolated preview paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('astro.config.mjs')
          s = p.read_text()
          s = s.replace("output: 'static',", "output: 'static',\n  site: 'https://yaskelly.github.io',\n  base: '/campus-yaskcode-preview/',")
          p.write_text(s)
          PY
      - name: Prepare verified lossless WebP images
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          names = [
              'campus-tropical-innovation-bg-v2.png', 'academy.png',
              'posgrado-luz.png', 'cti-pregrado.png', 'research.png', 'lab.png',
              'library.png', 'community.png', 'anfiteatro-moderno.png',
              'yaskcode-construccion.png', 'gdg-caracas.png', 'wtm-technovation.png',
              'smart-learning.png', 'home.yaskellyyedra.png',
              'entrada-yaskcode-v1.png', 'entrada-yaskcode-v2.png', 'buzon-yaskcode-v1.png',
              'conexiones-yaskcode-v1.png'
          ]
          rows = []
          responsive_rows = []
          for name in names:
              matches = list(Path('public/images').rglob(name))
              assert len(matches) == 1, f'Unexpected source: {name}'
              source = matches[0]
              target = source.with_suffix('.webp')
              with Image.open(source) as image:
                  original = image.convert('RGBA')
                  original.save(target, 'WEBP', lossless=True, exact=True, method=6)
                  with Image.open(target) as converted:
                      decoded = converted.convert('RGBA')
                      assert original.size == decoded.size
                      assert original.tobytes() == decoded.tobytes(), f'Pixel mismatch: {name}'
              # Smaller display variants retain exact RGBA pixels after resizing.
              variant_widths = [640, 960, 1280] if name.startswith('campus-tropical') else [128, 256, 512, 1024]
              variant_dir = Path('public/images/responsive')
              variant_dir.mkdir(parents=True, exist_ok=True)
              for variant_width in variant_widths:
                  variant_height = round(original.height * variant_width / original.width)
                  resized = original.resize((variant_width, variant_height), Image.Resampling.LANCZOS)
                  variant_file = variant_dir / f'{source.stem}-{variant_width}.webp'
                  resized.save(variant_file, 'WEBP', lossless=True, exact=True, method=6)
                  responsive_rows.append({'image': name, 'width': variant_width, 'bytes': variant_file.stat().st_size})
                  with Image.open(variant_file) as checked:
                      assert checked.convert('RGBA').tobytes() == resized.tobytes(), f'Variant mismatch: {variant_file}'
              before, after = source.stat().st_size, target.stat().st_size
              selected = target if after < before else source
              if selected == target:
                  old_url = '/' + source.relative_to('public').as_posix()
                  new_url = '/' + target.relative_to('public').as_posix()
                  for code in Path('src').rglob('*'):
                      if code.is_file() and code.suffix in ('.astro', '.ts', '.css'):
                          text = code.read_text()
                          if old_url in text:
                              code.write_text(text.replace(old_url, new_url))
              rows.append({'image': name, 'png_bytes': before, 'webp_bytes': after,
                           'selected_bytes': selected.stat().st_size,
                           'selected_format': selected.suffix, 'identical_rgba': True})
          report = {'images': rows, 'original_bytes': sum(x['png_bytes'] for x in rows),
                    'trial_bytes': sum(x['selected_bytes'] for x in rows),
                    'loading': 'Original lazy loading preserved'}
          report['responsive_variants'] = responsive_rows
          Path('public/image-comparison.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Adapt and verify preview resources
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          prefix = '/campus-yaskcode-preview/'
          class Resources(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  url = d.get('src') if tag in ('img', 'script') else d.get('href') if tag == 'link' else None
                  if url and url.startswith('/'):
                      assert url.startswith(prefix), f'Unscoped resource: {url}'
                      file = Path('dist') / url[len(prefix):].split('?')[0].split('#')[0]
                      assert file.is_file(), f'Missing resource: {file}'
          for p in Path('dist').rglob('*.html'):
              s = p.read_text()
              s = s.replace('/images/', prefix + 'images/')
              s = s.replace('</head>', '<meta name="robots" content="noindex,nofollow"></head>')
              p.write_text(s)
              Resources().feed(s)
          print('Preview paths and local resources verified.')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
